{% extends "main.html" %}

{% block tabs %}

    <style>

        .md-header {
            position: initial;
        }

        .md-main_inner {
            margin: 0;
        }
        
         .md-content {
      display: none;
    }
  </style>

  <!-- Hero for landing page -->
  <section class="mdx-container">
    <div class="md-grid md-typeset">
      <div class="mdx-hero">

        <!-- Hero image -->
        <div class="mdx-hero__image">
          <img
            src="images/Tupac_Amaru_II.jpg"
            alt="Tupac Amaru II on horseback with the Spanish inscription El Rebelde Tupac Amaro"
            width=100%
            height="1200"
            draggable="false"
          >
        </div>
      </div>
    </div>
  </section>
{% endblock %}

<!-- Content -->
{% block content %}{% endblock %}

<!-- Application footer -->
{% block footer %}{% endblock %}
